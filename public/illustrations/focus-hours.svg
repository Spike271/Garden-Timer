<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" width="24" height="24">
  <!-- Timer Dial Face -->
  <circle cx="12" cy="13" r="7.8" stroke="#376430" stroke-width="1.7" fill="#376430" fill-opacity="0.14" />

  <!-- Top Stem and Mechanical Crown -->
  <path d="M12 5.2V2.5" stroke="#376430" stroke-width="1.7" stroke-linecap="round" />
  <path d="M9.5 2.5h5" stroke="#376430" stroke-width="1.7" stroke-linecap="round" />

  <!-- Stopwatch Start/Lap Button -->
  <path d="M17.8 7.2l1.5-1.5" stroke="#376430" stroke-width="1.7" stroke-linecap="round" />

  <!-- Mindful Focus Tick Dots (12, 3, 6, 9) -->
  <circle cx="12" cy="7.2" r="0.75" fill="#376430" />
  <circle cx="17.8" cy="13" r="0.75" fill="#376430" />
  <circle cx="12" cy="18.8" r="0.75" fill="#376430" />
  <circle cx="6.2" cy="13" r="0.75" fill="#376430" />

  <!-- Focus Cadence Hands: 12 o'clock and 25-minute Pomodoro mark -->
  <path d="M12 8.6v4.4l3.1 2.1" stroke="#376430" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pivot Dot -->
  <circle cx="12" cy="13" r="1.1" fill="#376430" />
</svg>
