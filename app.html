<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden Timer: Mindful Botanical Focus</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link
      rel="preload"
      href="/MaterialSymbolsOutlined-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Google Fonts: Newsreader and Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/src/tailwind-app.css" />
    <style>
      .herbal-base {
        background-color: #f3fcf2;
      }

      @keyframes gentleBreathing {
        0%,
        100% {
          transform: scale(1) translateY(0);
        }
        50% {
          transform: scale(1.015) translateY(-2px);
        }
      }
    </style>
  </head>
  <body
    class="herbal-base text-on-surface antialiased min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-fixed-variant"
  >
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
