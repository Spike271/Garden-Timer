                        "surface-dim": "#d4dcd3",
                        "surface-container": "#e8f0e7",

                        "on-primary-fixed": "#002201",
                        "surface-container-high": "#e2ebe1",
                        "on-error-container": "#93000a",
                        "secondary-container": "#c1efb4",
                        "surface-bright": "#f3fcf2",
                        "background": "#f3fcf2",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb1c7",
                        "primary-fixed-dim": "#a1d494",
                        "error-container": "#ffdad6",

	<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            vertical-align: middle;
        }

        .pressed-paper-card {
            background-color: #f4f1e8;
            border: 1px solid #e5dfc9;
            box-shadow: 0 4px 20px -2px rgba(35, 43, 37, 0.05), 0 1px 3px rgba(35, 43, 37, 0.02);
        }

        .herbal-base {
            background-color: #f3fcf2;
        }

        .dial-circle-progress {
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes gentleBreathing {
            0%, 100% {
                transform: scale(1) translateY(0);
            }
            50% {
                transform: scale(1.015) translateY(-2px);
            }
        }

        .animate-botanical-breath {
            animation: gentleBreathing 7s ease-in-out infinite;
        }
	</style>
</head>
<body class="herbal-base text-on-surface antialiased min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-fixed-variant">
<div id="root" class="min-h-screen flex flex-col"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
